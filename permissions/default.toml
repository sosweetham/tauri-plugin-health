"$schema" = "schemas/schema.json"

[default]
description = """
Default permissions for the health plugin (auto-generated by build.rs based \
on enabled Cargo features).
"""
permissions = [
  "allow-is-available",
  "allow-request-permissions",
  "allow-check-permissions",
  "allow-open-settings",
  "allow-query-aggregated",
  "allow-query-sleep",
  "allow-query-workouts",
  "allow-query-heart-rate-samples",
]
