[package]
name = "tauri-plugin-health"
version = "0.1.0"
authors = ["SoSweetHam <sosweetham@gmail.com>"]
license = "MIT"
description = "Read activity, sleep, heart-rate and workout data in Tauri 2 apps — Apple HealthKit on iOS, Health Connect on Android."
edition = "2021"
rust-version = "1.77.2"
readme = "README.md"
repository = "https://github.com/sosweetham/tauri-plugin-health"
# crates.io: max 5, only [a-z0-9-_], must start with a letter, ≤20 chars each.
keywords = ["tauri", "tauri-plugin", "healthkit", "health-connect", "fitness"]
categories = ["api-bindings"]
exclude = [
  "/examples",
  "/dist-js",
  "/guest-js",
  "/node_modules",
  "/.tauri",
  "/ios/.build",
  "/ios/.tauri",
  "/android/build",
  "/android/.gradle",
  "/android/.tauri",
  "package.json",
  "pnpm-lock.yaml",
  "tsconfig.json",
  "rollup.config.js",
]
links = "tauri-plugin-health"

[dependencies]
tauri = { version = "2.10" }
serde = "1.0"
thiserror = "2"
# Annotation-only crate; the generators live in typeshare-cli (see
# `pnpm generate-types`).
typeshare = "1.0"

[build-dependencies]
tauri-plugin = { version = "2.5", features = ["build"] }

[features]
default = ["activity", "heart-rate", "sleep", "workouts"]
activity = []
heart-rate = []
sleep = []
workouts = []

